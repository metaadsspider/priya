<style>
:root{--accent:#2aabee;--accent-rgb:42,171,238;--bg:#0b1220;--card:#1c1f26;--ink:#fff;--ink-2:#9aa3ad;--line:rgba(255,255,255,.07);--dots:rgba(255,255,255,.07)}
body{--bg:#e9eef5;--card:#fff;--ink:#0f1419;--ink-2:#6b7480;--line:rgba(15,20,25,.07);--dots:rgba(15,20,25,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:70vmax;height:70vmax;left:-28vmax;top:-32vmax;background:radial-gradient(circle,rgba(var(--accent-rgb),.55) 0,transparent 65%);animation:d1 16s ease-in-out infinite alternate}
.b2{width:62vmax;height:62vmax;right:-26vmax;bottom:-32vmax;background:radial-gradient(circle,rgba(139,92,246,.45) 0,transparent 65%);animation:d2 19s ease-in-out infinite alternate}
body .blob{opacity:.55}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-7vmax,-5vmax) scale(1.08)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(var(--dots) 1.2px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 75%)}
.spark{position:absolute;bottom:-12px;width:5px;height:5px;border-radius:50%;background:rgba(var(--accent-rgb),1);opacity:0;box-shadow:0 0 10px 2px rgba(var(--accent-rgb),.9);animation:up linear infinite}
@keyframes up{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:.85}100%{transform:translateY(-110vh) scale(1.1);opacity:0}}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:38px 24px 28px;text-align:center;box-shadow:0 30px 70px rgba(15,20,25,.14);animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.97)}}
.avatar{position:relative;width:128px;height:128px;margin:0 auto 22px;animation:pop .8s .15s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),#8b5cf6,#ec4899,#f59e0b,#22c55e,var(--accent));animation:spin 3s linear infinite}
.ring.glow{inset:-10px;filter:blur(14px);opacity:.75}
.orbit{position:absolute;inset:-19px;border-radius:50%;animation:spin 7s linear infinite reverse}
.orbit i{position:absolute;top:50%;left:-4px;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(var(--accent-rgb),.9)}
.orbit i+i{left:auto;right:-3px;width:6px;height:6px;margin-top:-3px}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:4px solid var(--card);background:linear-gradient(135deg,var(--accent),#8b5cf6);display:grid;place-items:center;color:#fff;font-size:52px;font-weight:700;animation:breathe 4s ease-in-out infinite}
.face img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.035)}}
h1{font-size:23px;line-height:1.25;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;overflow-wrap:anywhere}
.count{color:var(--ink-2);font-size:15px;margin-bottom:16px}
.desc{font-size:16px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.desc.clamp{max-height:7.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.more{display:none;margin:6px auto 0;background:none;border:0;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.more.show{display:inline-block}
.join{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;min-width:230px;max-width:100%;padding:15px 30px;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;overflow:hidden;box-shadow:0 10px 28px rgba(var(--accent-rgb),.45);animation:pulse 2.4s ease-out infinite;transition:transform .15s,filter .15s}
.join:hover{filter:brightness(1.07)}
.join:active{transform:scale(.97)}
.join::after{content:"";position:absolute;top:0;bottom:0;left:-75%;width:50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite;z-index:-1}
.join svg{width:20px;height:20px;flex:none}
@keyframes shine{0%{left:-75%}55%,100%{left:130%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.55),0 10px 28px rgba(var(--accent-rgb),.45)}70%{box-shadow:0 0 0 16px rgba(var(--accent-rgb),0),0 10px 28px rgba(var(--accent-rgb),.45)}100%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),0),0 10px 28px rgba(var(--accent-rgb),.45)}}
.hint{margin-top:14px;color:var(--ink-2);font-size:13px;line-height:1.45}
.help{margin-top:18px;padding:14px;border-radius:16px;background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.28);animation:enter .35s ease-out both}
.help[hidden]{display:none}
.help b{display:block;font-size:15px;margin-bottom:4px}
.hbtn{display:block;width:100%;margin-top:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.hbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn[hidden]{display:none}
@media (max-height:660px){.avatar{width:104px;height:104px;margin-bottom:16px}.face{font-size:42px}.card{padding:28px 20px 22px}.join{margin-top:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<main class="card">

  <!-- ═══════════ ✏️ EDIT 3 — VISIBLE CONTENT ═══════════ -->
  <h1>TOSS KING MAHI 😎</h1>

  <div class="desc" id="desc">IAM NOT A FIXER CRICKET ❤️✌</div>
  <button class="more" id="more" type="button">Show more</button>

  <!-- Put YOUR invite link in href below (keep the + private link for request-to-join!) -->
  <a class="join" id="join" href="https://t.me/+B_TMz_z9fT1mYjY1" rel="nofollow">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.6 11.2 20.3 4.3c.8-.3 1.6.2 1.3 1.5l-3 14.2c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.2.2-.4.4-.9.4l.3-4.7 8.5-7.7c.4-.3-.1-.5-.6-.2L6.9 14 2.4 12.6c-1-.3-1-1 .2-1.4z"/></svg>

  <p class="hint">Tap JOIN CHANNEL, then tap “Request to Join” in Telegram</p>

  <div class="help" id="help" hidden>
    <b>Telegram didn't open?</b>
    <a class="hbtn pri" id="h-tg" href="#">Open in Telegram</a>
    <button class="hbtn" id="h-copy" type="button">Copy link</button>
    <small>Or tap ⋮ menu → “Open in Chrome”, then JOIN.</small>
  </div>

<script>
/* AUTO_OPEN = 0 → wait for click | 3 → auto-open Telegram after 3s (anti-bot filter) */
var AUTO_OPEN = 0;

(function () {
  var btn  = document.getElementById('join'),
      help = document.getElementById('help'),
      opened = false;

  /* build tg:// deep link from the https invite link automatically */
  var m = (btn.href || '').match(/t\.me\/(?:\+|joinchat\/)?([\w-]+)/);
  var deepLink = m ? 'tg://join?invite=' + m[1] : btn.href;
  document.getElementById('h-tg').href = btn.href;

  /* show more/less */
  var desc = document.getElementById('desc'), more = document.getElementById('more');
  if (desc.scrollHeight > (parseFloat(getComputedStyle(desc).lineHeight) || 24) * 5.2) {
    desc.classList.add('clamp'); more.classList.add('show');
    more.onclick = function () { desc.classList.remove('clamp'); more.classList.remove('show'); };
  }

  function openTG() {
    if (opened) return; opened = true;
    try { if (window.fbq) fbq('trackCustom', 'JoinClick'); } catch (e) {}
    try { window.location.href = deepLink; } catch (e) {}
    setTimeout(function () {
      if (document.visibilityState === 'visible') help.hidden = false;
    }, 1500);
  }

  btn.addEventListener('click', function (e) { e.preventDefault(); openTG(); });

  if (AUTO_OPEN > 0) setTimeout(function () {
    if (document.visibilityState === 'visible') openTG();
  }, AUTO_OPEN * 1000);

  document.getElementById('h-copy').onclick = function () {
    var t = document.createElement('textarea');
    t.value = btn.href; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e) {}
    t.remove(); this.textContent = 'Copied ✔';
  };
})();
</script>
