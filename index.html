
<!DOCTYPE html>
<html>
<head>
  <title>M3U8 Video Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }
    video {
      width: 90%;
      max-width: 900px;
      background: black;
    }
    input {
      width: 65%;
      padding: 12px;
      margin: 15px 5px;
    }
    button {
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>M3U8 HLS Player</h2>

<video id="video" controls playsinline></video>

<br>

<input id="url" type="text"
value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
placeholder="Enter M3U8 URL">

<button onclick="playStream()">PLAY</button>

<script>
const video = document.getElementById("video");
let hls;

function playStream() {
  const url = document.getElementById("url").value.trim();

  if (hls) {
    hls.destroy();
    hls = null;
  }

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        console.error("HLS Error:", data);
      }
    });

  } else if (video.canPlayType(
    "application/vnd.apple.mpegurl"
  )) {
    video.src = url;
    video.play().catch(() => {});
  } else {
    alert("HLS is not supported in this browser");
  }
}

playStream();
</script>

</body>
</html>
